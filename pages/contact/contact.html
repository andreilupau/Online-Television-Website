<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Global styles to match homepage nav/footer -->
    <link rel="stylesheet" href="../../assets/style.css" />
    <!-- Page-specific styles -->
    <link rel="stylesheet" href="contact.css" />
    <link rel="icon" type="image/x-icon" href="../../resources/logo.png" />
    <title>Contact - CobraNEWS</title>
  </head>
  <body>
    <!-- Navigation -->
    <nav class="nav-compact" aria-label="Main menu">
      <a href="../../index.html" aria-label="Home page">
        <img
          id="logo"
          src="../../resources/logo_simple.png"
          alt="CobraNEWS logo"
        />
      </a>
      <ul>
        <li><a href="../news/news.html">News</a></li>
        <li><a href="./contact.html" class="active">Contact</a></li>
        <li>
          <button
            id="theme-toggle"
            class="theme-toggle"
            aria-label="Toggle dark mode"
            title="Dark/Light mode"
          >
            🌙
          </button>
        </li>
      </ul>
    </nav>

    <!-- Page main -->
    <main class="contact-main">
      <section class="contact-hero">
        <h1>Contact</h1>
        <p>
          Have a question or idea? Send me a message — I'd love to hear from
          you.
        </p>
      </section>

      <section class="contact-grid">
        <form
          id="contact-form"
          class="contact-form"
          method="POST"
          novalidate
          data-endpoint="https://formspree.io/f/REPLACE_FORM_ID"
        >
          <input
            type="hidden"
            name="_subject"
            value="New message from CobraNEWS contact form"
          />
          <label>
            Name
            <input
              type="text"
              name="name"
              placeholder="Your full name"
              required
            />
          </label>

          <label>
            Email
            <input
              type="email"
              name="email"
              placeholder="you@example.com"
              required
            />
          </label>

          <label class="full">
            Message
            <textarea
              name="message"
              placeholder="Write your message"
              required
            ></textarea>
          </label>

          <label class="consent">
            <input type="checkbox" name="consent" required /> I agree to be
            contacted regarding my message.
          </label>

          <div class="actions">
            <button type="submit" class="btn-primary">Send</button>
          </div>
          <p
            id="form-status"
            class="form-status"
            role="status"
            aria-live="polite"
          ></p>
        </form>
      </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer" role="contentinfo">
      <div class="footer-inner">
        <a
          href="../index.html"
          class="footer-brand"
          aria-label="Go to top/Home"
        >
          <img src="../../resources/logo.png" alt="CobraNEWS logo" />
        </a>
        <nav class="footer-nav" aria-label="Footer">
          <a href="#">Terms & Conditions</a>
          <a href="#">Privacy Policy</a>
          <a href="./contact.html" class="active">Contact</a>
        </nav>
      </div>
      <div class="footer-copy">© 2025 CobraNEWS. All rights reserved.</div>
    </footer>

    <script src="../../assets/script.js"></script>
  </body>
</html>
